name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff (Python)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.7"
      - name: ShellCheck (installer and git hooks)
        run: shellcheck -s sh -S warning install.sh template/.waypoint/hooks/pre-commit template/.waypoint/hooks/commit-msg template/.waypoint/hooks/post-commit

  test:
    strategy:
      fail-fast: false
      # macOS is left out: on a private repo its runner minutes count 10x against the free quota.
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and hook tests
        env:
          WAYPOINT_NO_UPDATE_CHECK: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
